[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-clinic"
version = "0.1.0"
description = "PCB 打样前体检：Gerber 解析、DFM 规则、SVG 预览与粗算报价"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "QKXWX"}]

[project.scripts]
pcb-clinic = "pcb_clinic.__main__:main"

[tool.setuptools.packages.find]
include = ["pcb_clinic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
